# 放到 /etc/nginx/sites-available/momo 并软链到 sites-enabled。
# 应用本身没有登录，务必保留 auth_basic：sudo htpasswd -c /etc/nginx/.momo_htpasswd 用户名
# HTTPS：sudo certbot --nginx -d momo.example.com
upstream momo { server 127.0.0.1:8765; }

server {
    listen 80;
    server_name momo.example.com;

    auth_basic "momo";
    auth_basic_user_file /etc/nginx/.momo_htpasswd;

    location / {
        proxy_pass http://momo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;        # 生成短文时进度不卡
        proxy_read_timeout 600s;    # 慢模型不超时
    }
}
